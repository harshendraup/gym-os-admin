<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- /favicon.svg never existed, so every tab was silently falling back to
         the browser's generic globe icon. apple-touch-icon covers "Add to
         Home Screen" on iOS, which does not read the favicon link at all. -->
    <link rel="icon" type="image/png" href="/logo/k1_logo.png" />
    <link rel="apple-touch-icon" href="/logo/k1_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>KrikalOne Admin - Gym Management System & Fitness Business Platform</title>
    <meta name="description" content="KrikalOne is a comprehensive gym SaaS management platform for fitness businesses. Manage memberships, workout plans, diet programs, payments, and member engagement in one powerful admin dashboard." />
    <meta name="keywords" content="gym management software, fitness business platform, gym administration, membership management, workout plans, diet programs, gym SaaS, fitness center management, health club software" />
    <meta name="author" content="KrikalOne" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4f46e5" />
    
    <!-- Open Graph / Social Media Optimization -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KrikalOne Admin - Gym Management System & Fitness Business Platform" />
    <meta property="og:description" content="Comprehensive gym SaaS management platform for fitness businesses. Manage memberships, workout plans, diet programs, payments, and member engagement in one powerful admin dashboard." />
    <meta property="og:image" content="/logo/k1_logo.png" />
    <meta property="og:url" content="https://krikalone.com/admin" />
    <meta property="og:site_name" content="KrikalOne" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Optimization -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KrikalOne Admin - Gym Management System & Fitness Business Platform" />
    <meta name="twitter:description" content="Comprehensive gym SaaS management platform for fitness businesses. Manage memberships, workout plans, diet programs, payments, and member engagement in one powerful admin dashboard." />
    <meta name="twitter:image" content="/logo/k1_logo.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://krikalone.com/admin" />
    
    <!-- Structured Data for AI Engine Optimization -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "creator": {

        "Diet Program Management",

        "Branch Management",

    }

    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
